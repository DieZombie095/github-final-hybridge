# Integrar en /etc/ssh/sshd_config o sshd_config.d; revisar directivas duplicadas.
# Mantener abierta la sesión actual y probar una segunda conexión antes de cerrar.
Port 2222
PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
